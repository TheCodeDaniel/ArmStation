name: spikes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run spikes and record results
        run: |
          mkdir -p docs/spike-results
          R=docs/spike-results/macos-arm64.txt
          {
            echo "## host"; uname -m; sw_vers; sysctl -n machdep.cpu.brand_string
            sysctl hw.ncpu hw.memsize 2>&1
            sysctl hw.optional.arm.FEAT_LRCPC hw.optional.arm.FEAT_LSE 2>&1
            echo "## build"
            c++ -std=c++20 -O2 -Wall -Wextra spikes/address_space_probe.cpp -o /tmp/asp 2>&1
            c++ -std=c++20 -O2 -Wall -Wextra spikes/tso_bench.cpp -o /tmp/tso 2>&1
            echo "## address_space_probe"; /tmp/asp 2>&1
            echo "## tso_bench"; /tmp/tso 2>&1; /tmp/tso 2>&1
          } > $R 2>&1 || true
          cat $R
          git config user.name "spikes-bot"; git config user.email "bot@users.noreply.github.com"
          git add $R && git commit -m "Record spike results (macOS arm64 CI)" && git push
